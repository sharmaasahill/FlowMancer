# Local stack: PostgreSQL + backend + frontend.
# The AI runs on Gemini (key in backend/.env). Ollama, if used, stays on your machine.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flowmancer
      POSTGRES_PASSWORD: flowmancer   # local development only
      POSTGRES_DB: flowmancer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmancer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://flowmancer:flowmancer@postgres:5432/flowmancer
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - knowledge_data:/app/knowledge_data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  knowledge_data:
