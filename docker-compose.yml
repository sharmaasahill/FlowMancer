services:
  # PostgreSQL database (local dev outside Docker uses SQLite instead)
  postgres:
    image: postgres:15-alpine
    container_name: flowmancer-db
    environment:
      POSTGRES_USER: flowmancer
      POSTGRES_PASSWORD: flowmancer123
      POSTGRES_DB: flowmancer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmancer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowmancer-backend
    # Secrets, AI provider, model, etc. come from backend/.env
    env_file:
      - ./backend/.env
    # These override .env so the container talks to the right services
    environment:
      - DATABASE_URL=postgresql://flowmancer:flowmancer123@postgres:5432/flowmancer_db
      # Ollama runs on your machine, not in Docker
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - knowledge_data:/app/knowledge_data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowmancer-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  knowledge_data:

networks:
  default:
    name: flowmancer-network
