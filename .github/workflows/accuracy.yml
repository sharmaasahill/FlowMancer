# Accuracy test: runs the 30 labelled cases in backend/eval against the real Gemini model.
# Needs a repository secret named GEMINI_API_KEY (Settings -> Secrets and variables -> Actions).
# Without it (or on pull requests from forks, which can't read secrets) the job is skipped, not failed.
name: Accuracy

on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  schedule:
    - cron: "0 6 * * 1"       # every Monday 06:00 UTC, to catch model changes on Google's side
  pull_request:
    paths:                    # only when something that affects AI answers changes
      - "backend/app/agents/**"
      - "backend/app/core/llm.py"
      - "backend/app/schemas/results.py"
      - "backend/app/services/processing.py"
      - "backend/eval/**"
      - ".github/workflows/accuracy.yml"

permissions:
  contents: read

concurrency:                  # one run at a time, so the free-tier rate limit isn't shared
  group: accuracy
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - name: Check for the API key
        id: key
        working-directory: .
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY secret is not set, so the accuracy test was skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache the embedding model
        if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-minilm-v1
      - name: Install dependencies
        if: steps.key.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run the accuracy test (must stay at 90% or above)
        if: steps.key.outputs.skip != 'true'
        run: python -m eval.run_eval --min-accuracy 90 --summary "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        if: always() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: backend/eval/results/
          if-no-files-found: ignore
